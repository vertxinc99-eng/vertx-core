<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111b">
  <title>VERTX CORE v0.4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">VERTX</p>
        <h1>CORE <span>v0.4</span></h1>
      </div>
      <button id="resetBtn" class="icon-btn" aria-label="データを初期化">↻</button>
    </header>

    <main>
      <section id="home" class="screen active" aria-labelledby="homeTitle">
        <div class="hero card">
          <p class="muted">お疲れさまです</p>
          <h2 id="homeTitle">今日も安全第一で。</h2>
          <button class="primary-btn" data-go="order">＋ 資材注文を作る</button>
        </div>

        <div class="stats-grid">
          <article class="card stat"><span>今日の注文</span><strong id="todayCount">0</strong></article>
          <article class="card stat"><span>保存済み履歴</span><strong id="historyCount">0</strong></article>
        </div>

        <div class="section-head"><h3>クイックメニュー</h3></div>
        <div class="menu-grid">
          <button class="menu-card" data-go="order"><span>📦</span><b>資材注文</b><small>数量を選んで注文</small></button>
          <button class="menu-card" data-go="history"><span>📋</span><b>注文履歴</b><small>過去の注文を確認</small></button>
        </div>
      </section>

      <section id="order" class="screen" aria-labelledby="orderTitle">
        <div class="screen-head">
          <button class="back-btn" data-go="home">‹</button>
          <div><p class="eyebrow">ORDER</p><h2 id="orderTitle">資材注文</h2></div>
        </div>

        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="資材を検索">
        </label>

        <div class="chips" id="categoryChips"></div>
        <div id="materialList" class="material-list"></div>

        <div class="sticky-summary card">
          <div><span>合計</span><strong><span id="totalQty">0</span>点</strong></div>
          <div><span>重量</span><strong><span id="totalWeight">0.0</span>kg</strong></div>
          <button id="toConfirmBtn" class="primary-btn">注文確認へ</button>
        </div>
      </section>

      <section id="confirm" class="screen" aria-labelledby="confirmTitle">
        <div class="screen-head">
          <button class="back-btn" data-go="order">‹</button>
          <div><p class="eyebrow">CONFIRM</p><h2 id="confirmTitle">注文確認</h2></div>
        </div>

        <div class="card form-card">
          <label>現場名<input id="siteName" type="text" placeholder="例：品川〇〇ビル"></label>
          <label>希望日<input id="deliveryDate" type="date"></label>
          <label>メモ<textarea id="orderMemo" rows="3" placeholder="搬入時間・注意事項など"></textarea></label>
        </div>

        <div class="section-head"><h3>注文内容</h3></div>
        <div id="confirmItems" class="card confirm-list"></div>
        <div class="card totals-card">
          <div><span>合計数量</span><strong id="confirmQty">0点</strong></div>
          <div><span>推定重量</span><strong id="confirmWeight">0.0kg</strong></div>
        </div>
        <button id="submitOrderBtn" class="primary-btn full">この内容で注文する</button>
      </section>

      <section id="history" class="screen" aria-labelledby="historyTitle">
        <div class="screen-head">
          <button class="back-btn" data-go="home">‹</button>
          <div><p class="eyebrow">HISTORY</p><h2 id="historyTitle">注文履歴</h2></div>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <section id="success" class="screen success-screen" aria-labelledby="successTitle">
        <div class="success-mark">✓</div>
        <p class="eyebrow">COMPLETE</p>
        <h2 id="successTitle">注文を保存しました</h2>
        <p class="muted center">履歴からいつでも確認・再注文できます。</p>
        <button class="primary-btn full" data-go="history">注文履歴を見る</button>
        <button class="secondary-btn full" data-go="home">ホームへ戻る</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-go="home" class="nav-item active"><span>⌂</span><small>ホーム</small></button>
      <button data-go="order" class="nav-item"><span>▣</span><small>注文</small></button>
      <button data-go="history" class="nav-item"><span>☷</span><small>履歴</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
